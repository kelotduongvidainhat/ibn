input {
  beats {
    port => 5044
  }
}

filter {
  if [container][name] =~ /peer|orderer|ca/ {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{NOTSPACE:id} %{LOGLEVEL:level} \[%{NOTSPACE:module}\] %{GREEDYDATA:log_message}" }
    }
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "fabric-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
