global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fabric_peers'
    static_configs:
      - targets:
        - 'peer0.org1.example.com:9443'
        - 'peer0.org2.example.com:9443'
        - 'peer0.org3.example.com:9443'

  - job_name: 'fabric_orderers'
    static_configs:
      - targets:
        - 'orderer.example.com:9443'
